      const a = alcanzable(f.id);
      const act = cierreActivos((f.dependencias && f.dependencias.activos) || []);
      // RPO alcanzable: la copia menos frecuente entre los activos que guardan datos de la función. Las copias de
      // configuración (red, directorio, servidores sin estado) no determinan la pérdida de datos de negocio.
      let rpoAlc = null; let rpoCausa = null; let sinCopia = null;
      for (const aId of act) {
        const a0 = aById.get(aId); if (a0.datos !== true) continue;
        const b = a0.backup; const fr = b && b.aplica !== false ? num(b.frecuenciaHoras) : null;
        if (fr === null) { sinCopia = sinCopia || aId; continue; }
        if (rpoAlc === null || fr > rpoAlc) { rpoAlc = fr; rpoCausa = aId; }
      }
      const crit = criticidad(curva);
      return {
        id: f.id, nombre: f.nombre, f, curva, criticidad: crit, critica: crit !== 'BAJA',
        mtpdMatriz: mtpdMatriz(curva), rto, rpo, mtpd, costeHora: coste,
        rtoAlcanzable: a.t, rtoCausa: a.causa, rpoAlcanzable: sinCopia ? Infinity : rpoAlc, rpoCausa: sinCopia || rpoCausa, sinCopia,
        activos: [...act],
        cumpleRto: rto === null ? null : a.t <= rto + 1e-9,
        cumpleRpo: rpo === null ? null : sinCopia ? false : rpoAlc === null ? null : rpoAlc <= rpo + 1e-9,
        viable: rto === null || mtpd === null ? null : rto < mtpd,
        exposicion: rto === null ? 0 : Math.max(0, a.t - rto) * coste,
        impactoRto: (rto || 0) * coste,
        impactoAlcanzable: a.t * coste
      };
    });
    const fxById = new Map(fx.map((x) => [x.id, x]));

    // Objetivo que debe cumplir cada activo: el menor RTO y RPO de las funciones que lo necesitan
    const ax = activos.map((a) => {
      const usan = fx.filter((x) => x.activos.includes(a.id));
      const rtos = usan.map((x) => x.rto).filter((v) => v !== null);
      const rpos = usan.map((x) => x.rpo).filter((v) => v !== null);
      return { id: a.id, nombre: a.nombre, a, inicio: rec.inicio.get(a.id) || 0, fin: rec.fin.get(a.id) || 0, tiempo: tiempoActivo(a),
        funciones: usan.map((x) => x.id), critico: usan.some((x) => x.critica),
        rtoObjetivo: rtos.length ? Math.min(...rtos) : null, rpoObjetivo: rpos.length ? Math.min(...rpos) : null };
    });
    // Orden de recuperación: respeta dependencias; a igualdad, primero lo que exige menor RTO
    const pos = new Map(rec.orden.map((id, i) => [id, i]));
    const axOrden = [...ax].sort((p, q) => (p.inicio - q.inicio) || ((p.rtoObjetivo ?? 1e9) - (q.rtoObjetivo ?? 1e9)) || (pos.get(p.id) - pos.get(q.id)));
    axOrden.forEach((x, i) => { x.orden = i + 1; });

    // Pruebas: la más reciente por activo y por función
    const pruebas = (st.pruebas || []).slice().sort((p, q) => String(q.fecha).localeCompare(String(p.fecha)));
    const ultimaPrueba = (id) => pruebas.find((p) => p.resultado !== 'Cancelado' && ((p.activos || []).includes(id) || (p.funciones || []).includes(id)));

    const checks = auditar(st, { fx, fxById, ax, aById, pById, rec, ciclosF, hoy, ultimaPrueba, pruebas });
    const kpi = {
      funciones: fx.length,
      criticas: fx.filter((x) => x.critica).length,
      conObjetivos: fx.filter((x) => x.rto !== null && x.rpo !== null && x.mtpd !== null).length,
      cumplenRto: fx.filter((x) => x.cumpleRto === true).length,
      evaluables: fx.filter((x) => x.cumpleRto !== null).length,
      exposicion: fx.reduce((s, x) => s + x.exposicion, 0),
      peorBrecha: fx.reduce((m, x) => (x.rto !== null ? Math.max(m, x.rtoAlcanzable - x.rto) : m), 0),
      activos: ax.length,
      pruebas: pruebas.length,
      ncMayor: checks.filter((c) => c.sev === 'NC mayor').length,
      ncMenor: checks.filter((c) => c.sev === 'NC menor').length,
      obs: checks.filter((c) => c.sev === 'Observación').length
    };
    kpi.preparacion = kpi.evaluables ? kpi.cumplenRto / kpi.evaluables : 0;
    const ens = estadoEns(st, checks);
    return { hoy, funciones: fx, fxById, activos: ax, ordenRecuperacion: axOrden, ciclos: { activos: rec.ciclos, funciones: ciclosF }, checks, kpi, ens, pruebas };
  }

  /* ---------- Preauditoría: reglas ---------- */
  const REGLAS = [
    ['BIA-01', 'Función crítica sin objetivos de recuperación', 'ISO 22301 § 8.2.3 · ENS op.cont.1'],
    ['BIA-02', 'RTO igual o superior al MTPD', 'ISO 22301 § 8.2.3'],
    ['BIA-03', 'MTPD más largo de lo que admite el impacto', 'ISO 22301 § 8.2.3'],
    ['BIA-04', 'Función sin valoración de impacto', 'ISO 22301 § 8.2.2'],
    ['BIA-05', 'Función sin responsable', 'ISO 22301 § 5.3'],
    ['DEP-01', 'Dependencia que se recupera después de lo que exige la función', 'ISO 22301 § 8.2.2 c'],
    ['DEP-02', 'Dependencias circulares', 'ISO 22301 § 8.2.2 c'],
    ['DEP-03', 'Proveedor con un plazo de servicio mayor que el RTO', 'ISO 22301 § 8.3 · ISO/IEC 27001 A.5.22'],
    ['DEP-04', 'Proveedor crítico sin continuidad verificada', 'ISO/IEC 27001 A.5.22 · A.5.23'],
    ['DRP-01', 'RTO no alcanzable con la estrategia actual', 'ISO 22301 § 8.3 · ENS op.cont.2'],
    ['DRP-02', 'Activo de una función crítica sin estrategia de recuperación', 'ISO 22301 § 8.3 · ENS op.cont.2'],
    ['DRP-03', 'Activo sin procedimiento de recuperación documentado', 'ISO 22301 § 8.4.4'],
    ['BCK-01', 'RPO no alcanzable con la frecuencia de copia', 'ISO/IEC 27001 A.8.13 · ENS mp.info.6'],
    ['BCK-02', 'Sin prueba de restauración reciente', 'ISO/IEC 27001 A.8.13 · ENS mp.info.6'],
    ['BCK-03', 'Copias sin ejemplar fuera de la sede (3-2-1)', 'ISO/IEC 27001 A.8.13'],
    ['BCK-04', 'Copias sin cifrar', 'ISO/IEC 27001 A.8.13 · A.8.24 · ENS mp.info.6'],
    ['BCK-05', 'Sin copia inmutable o desconectada', 'ISO/IEC 27001 A.8.13 · CCN-STIC 817'],
    ['BCP-01', 'Rol del equipo de crisis sin suplente', 'ISO 22301 § 8.4.2'],
    ['BCP-02', 'Criterio de activación ausente o más lento que el RTO', 'ISO 22301 § 8.4.2'],
    ['BCP-03', 'Sin canal de comunicación independiente de los sistemas', 'ISO 22301 § 8.4.3'],
    ['BCP-04', 'Categoría ALTA sin medios alternativos', 'ENS op.cont.4 · ISO 22301 § 8.3'],
    ['BCP-05', 'El sitio alternativo tarda más en activarse que el RTO', 'ENS op.cont.4 · ISO 22301 § 8.3'],
    ['TST-01', 'Función crítica sin ninguna prueba', 'ENS op.cont.3 · ISO 22301 § 8.5'],
    ['TST-02', 'Prueba con RTO o RPO medido peor que el objetivo', 'ENS op.cont.3 · ISO 22301 § 8.5'],
    ['TST-03', 'Prueba fallida o parcial sin acción correctiva', 'ISO 22301 § 10.1'],
    ['TST-04', 'Última prueba hace más de un año', 'ENS op.cont.3 · ISO 22301 § 8.5'],
    ['REV-01', 'Revisión del BIA vencida o sin fecha', 'ISO 22301 § 9.1 · ENS op.cont.1'],
    ['REV-02', 'Plan sin aprobación de la dirección', 'ISO 22301 § 5.1 · § 5.2']
  ];
  const REGLA = Object.fromEntries(REGLAS.map(([id, titulo, ref]) => [id, { titulo, ref }]));

  function auditar(st, c) {
    const out = []; const cat = CATEGORIAS.includes(st.meta && st.meta.categoria) ? st.meta.categoria : 'MEDIA';
    const exigeContinuidad = cat !== 'BÁSICA'; // op.cont.2 y op.cont.3 desde MEDIA
    const add = (id, sev, ambito, detalle, recomendacion) => out.push({ id, sev, ambito, titulo: REGLA[id].titulo, detalle, recomendacion, ref: REGLA[id].ref });
    const nf = (id) => (c.fxById.get(id) || { nombre: id }).nombre;
    const na = (id) => (c.aById.get(id) || { nombre: id }).nombre;

    for (const x of c.fx) {
      const f = x.f; const amb = `${x.id} · ${x.nombre}`;
      if (!tieneImpacto(f)) add('BIA-04', 'NC menor', amb, 'No hay impacto valorado en ningún horizonte. Sin él no se puede justificar la criticidad ni el MTPD.', 'Valorar el impacto operativo, legal, reputacional y sobre las personas a 1 h, 4 h, 24 h, 72 h y 7 días.');
      if (x.critica && (x.rto === null || x.rpo === null || x.mtpd === null)) {
        const falta = [x.rto === null && 'RTO', x.rpo === null && 'RPO', x.mtpd === null && 'MTPD'].filter(Boolean).join(', ');
        add('BIA-01', 'NC mayor', amb, `Criticidad ${x.criticidad} sin ${falta}.`, 'Fijar los objetivos con el responsable de la función y aprobarlos con la dirección.');
      }
      if (x.viable === false) add('BIA-02', 'NC mayor', amb, `RTO ${fmtH(x.rto)} frente a un MTPD de ${fmtH(x.mtpd)}: la función se recupera cuando el daño ya es inaceptable.`, 'Reducir el RTO por debajo del MTPD o revisar el MTPD con la dirección.');
      if (x.mtpd !== null && x.mtpdMatriz !== null && x.mtpd > x.mtpdMatriz) add('BIA-03', 'NC menor', amb, `MTPD declarado ${fmtH(x.mtpd)}; la matriz de impacto alcanza «Crítico» a las ${fmtH(x.mtpdMatriz)}.`, `Bajar el MTPD a ${fmtH(x.mtpdMatriz)} o revisar la valoración del impacto.`);
      if (isBlank(f.responsable)) add('BIA-05', 'Observación', amb, 'La función no tiene responsable de negocio asignado.', 'Asignar un responsable que valide el impacto y los objetivos.');
      if (x.rto !== null) {
        for (const fId of (f.dependencias && f.dependencias.funciones) || []) {
          const d = c.fxById.get(fId); if (!d || d.rto === null) continue;
          if (d.rto > x.rto) add('DEP-01', 'NC mayor', amb, `Depende de ${d.id} · ${d.nombre}, con RTO ${fmtH(d.rto)}, mayor que su propio RTO de ${fmtH(x.rto)}.`, `Alinear el RTO de ${d.id} a ${fmtH(x.rto)} como máximo o eliminar la dependencia.`);
        }
        for (const pId of (f.dependencias && f.dependencias.proveedores) || []) {
          const p = c.pById.get(pId); if (!p) continue; const sla = num(p.slaHoras);
          if (sla === null) add('DEP-03', x.critica ? 'NC menor' : 'Observación', amb, `El proveedor ${p.nombre} no tiene plazo de restablecimiento acordado.`, 'Incluir en el contrato un plazo de restablecimiento compatible con el RTO.');
          else if (sla > x.rto) add('DEP-03', x.critica ? 'NC mayor' : 'NC menor', amb, `${p.nombre} se compromete a ${fmtH(sla)}; la función necesita ${fmtH(x.rto)}.`, 'Renegociar el acuerdo de nivel de servicio o disponer de un proveedor o medio alternativo.');
        }
        if (x.cumpleRto === false) {
          const cz = x.rtoCausa; const quien = !cz ? '' : cz.tipo === 'activo' ? `el activo ${cz.id} · ${na(cz.id)}` : cz.tipo === 'proveedor' ? `el proveedor ${(c.pById.get(cz.id) || {}).nombre || cz.id}` : `la función ${cz.id} · ${nf(cz.id)}`;
          add('DRP-01', x.critica ? 'NC mayor' : 'NC menor', amb, `RTO objetivo ${fmtH(x.rto)}; con las estrategias actuales la función vuelve a las ${fmtH(x.rtoAlcanzable)}. Marca el ritmo ${quien}.${x.costeHora ? ` Exposición: ${Math.round(x.exposicion).toLocaleString('es-ES')} € por incidente.` : ''}`, 'Mejorar la estrategia del elemento que marca el ritmo (p. ej. de cold a warm standby) o reconsiderar el RTO.');
        }
      }
      if (x.cumpleRpo === false && x.sinCopia) add('BCK-01', x.critica ? 'NC mayor' : 'NC menor', amb, `RPO objetivo ${fmtH(x.rpo)}; ${c.aById.get(x.sinCopia).nombre} guarda datos de la función y no tiene copia definida.`, `Definir la copia de ${x.sinCopia} con una frecuencia de ${fmtH(x.rpo)} como máximo.`);
      else if (x.cumpleRpo === false) add('BCK-01', x.critica ? 'NC mayor' : 'NC menor', amb, `RPO objetivo ${fmtH(x.rpo)}; la copia de ${c.aById.get(x.rpoCausa).nombre} se hace cada ${fmtH(x.rpoAlcanzable)}.`, `Aumentar la frecuencia de copia o replicar ${x.rpoCausa} para que la pérdida máxima no supere ${fmtH(x.rpo)}.`);
      for (const pId of (f.dependencias && f.dependencias.proveedores) || []) {
        const p = c.pById.get(pId); if (p && x.critica && !p.bcmVerificado) add('DEP-04', 'Observación', `${p.id} · ${p.nombre}`, `Sostiene la función crítica ${x.id} y no se ha verificado su plan de continuidad.`, 'Solicitar evidencias del plan de continuidad del proveedor y de sus pruebas.');
      }
      if (x.critica && exigeContinuidad && !c.ultimaPrueba(x.id) && !x.activos.some((aId) => c.ultimaPrueba(aId))) add('TST-01', 'NC mayor', amb, 'Ninguna prueba registrada sobre la función ni sobre sus activos.', 'Planificar al menos un ejercicio de mesa y una restauración de los activos que la sostienen.');
    }
    for (const cyc of c.rec.ciclos) add('DEP-02', 'NC mayor', cyc.join(' → '), 'Los activos dependen unos de otros en círculo: no existe un orden de recuperación posible.', 'Romper el ciclo identificando qué componente puede arrancar sin el otro.');
    for (const cyc of c.ciclosF) add('DEP-02', 'NC mayor', cyc.join(' → '), 'Las funciones dependen unas de otras en círculo.', 'Revisar el mapa de dependencias con los responsables de cada función.');

    for (const x of c.ax) {
      const a = x.a; const amb = `${a.id} · ${a.nombre}`;
      if (x.critico && (!a.estrategia || a.estrategia === 'ninguna')) add('DRP-02', exigeContinuidad ? 'NC mayor' : 'NC menor', amb, `Sostiene ${x.funciones.join(', ')} y no tiene estrategia de recuperación.`, 'Elegir hot, warm, cold standby o recuperación en la nube según el RTO de las funciones.');
      const pr = a.procedimiento || {};
      if (x.critico && (isBlank(pr.pasos) || isBlank(pr.exito))) add('DRP-03', 'NC menor', amb, `Falta ${[isBlank(pr.pasos) && 'el paso a paso', isBlank(pr.exito) && 'el criterio de éxito'].filter(Boolean).join(' y ')}.`, 'Documentar pasos ejecutables por un técnico sin conocimiento previo y cómo se verifica que funciona.');
      const b = a.backup;
      if (b && b.aplica !== false) {
        const lim = x.critico && a.datos === true ? 30 : 90; // datos de funciones críticas: mensual; configuración y resto: trimestral
        const ult = b.ultimaRestauracion;
        const sevR = x.critico && a.datos === true ? 'NC mayor' : 'NC menor';
        if (!ult) add('BCK-02', sevR, amb, 'No consta ninguna prueba de restauración.', `Restaurar una muestra y registrar fecha, responsable y resultado (al menos cada ${lim} días).`);
        else { const d = diasEntre(ult, c.hoy); if (d > lim) add('BCK-02', sevR, amb, `Última restauración el ${ult}, hace ${d} días (límite: ${lim}).`, 'Repetir la prueba de restauración y registrar el resultado.'); }
        if (b.resultado === 'Fallido') add('BCK-02', 'NC mayor', amb, 'La última prueba de restauración falló.', 'Corregir la causa y repetir la prueba.');
        if (!b.offsite) add('BCK-03', x.critico ? 'NC menor' : 'Observación', amb, 'No hay copia fuera de la sede principal.', 'Aplicar la regla 3-2-1: tres copias, dos soportes, una fuera de la sede.');
        if (!b.cifrado) add('BCK-04', 'NC menor', amb, 'Las copias no están cifradas.', 'Cifrar las copias en tránsito y en reposo y custodiar las claves aparte.');
        if (x.critico && a.datos === true && !b.inmutable) add('BCK-05', 'Observación', amb, 'Ninguna copia inmutable o desconectada: un ransomware podría cifrar también las copias.', 'Mantener al menos una copia inmutable o fuera de línea.');
      }
    }

    const bcp = st.bcp || {};
    for (const r of bcp.equipo || []) if (!isBlank(r.titular) && isBlank(r.suplente)) add('BCP-01', exigeContinuidad ? 'NC menor' : 'Observación', r.rol || 'Equipo de crisis', `${r.titular} no tiene suplente: si no está disponible, el plan se detiene.`, 'Designar un suplente con la misma autoridad y formación.');
    if ((bcp.equipo || []).length === 0 || (bcp.equipo || []).every((r) => isBlank(r.titular))) add('BCP-01', exigeContinuidad ? 'NC mayor' : 'NC menor', 'Equipo de crisis', 'No hay equipo de crisis designado.', 'Designar al menos responsable de crisis, de recuperación técnica y de comunicación, con suplentes.');
    const minRtoCrit = Math.min(...c.fx.filter((x) => x.critica && x.rto !== null).map((x) => x.rto));
    const umbral = num(bcp.activacion && bcp.activacion.umbralHoras);
    if (umbral === null || isBlank(bcp.activacion && bcp.activacion.autorizado)) add('BCP-02', exigeContinuidad ? 'NC menor' : 'Observación', 'Activación', 'No hay umbral objetivo de activación o persona autorizada para activar el plan.', 'Fijar un umbral de tiempo sin servicio que active el plan sin esperar a una decisión ad hoc.');
    else if (Number.isFinite(minRtoCrit) && umbral >= minRtoCrit) add('BCP-02', 'NC mayor', 'Activación', `El plan se activa a las ${fmtH(umbral)} y la función crítica más exigente tiene un RTO de ${fmtH(minRtoCrit)}: se activaría con el objetivo ya incumplido.`, `Bajar el umbral de activación por debajo de ${fmtH(minRtoCrit)}.`);
    const com = bcp.comunicacion || {};
    if (isBlank(com.secundario)) add('BCP-03', exigeContinuidad ? 'NC menor' : 'Observación', 'Comunicación', 'No hay canal secundario que funcione con los sistemas caídos.', 'Definir un canal alternativo (telefonía móvil, mensajería externa, lista de contactos impresa).');
    const site = bcp.sitio || {};
    const hayCritica = c.fx.some((x) => x.critica);
    if (cat === 'ALTA' && hayCritica && (!site.tipo || site.tipo === 'ninguno')) add('BCP-04', 'NC mayor', 'Sitio alternativo', 'Sistema de categoría ALTA sin sitio alternativo ni medios alternativos documentados.', 'Disponer de un sitio de recuperación o de medios manuales probados para los servicios esenciales.');
    const rtoSitio = num(site.rtoActivacion);
    if (site.tipo && site.tipo !== 'ninguno' && rtoSitio !== null && Number.isFinite(minRtoCrit) && rtoSitio > minRtoCrit) add('BCP-05', 'NC mayor', 'Sitio alternativo', `Activar el sitio alternativo lleva ${fmtH(rtoSitio)}; la función crítica más exigente necesita ${fmtH(minRtoCrit)}.`, 'Mejorar la preparación del sitio alternativo o revisar qué funciones dependen de él.');

    for (const p of c.pruebas) {
      if (p.resultado === 'Cancelado') continue;
      const amb = `${p.id} · ${(TIPOS_PRUEBA[p.tipo] || {}).label || p.tipo} · ${p.fecha || 'sin fecha'}`;
      const objs = [...(p.funciones || []).map((id) => c.fxById.get(id)).filter(Boolean)];
      const rtoReal = num(p.rtoReal); const rpoReal = num(p.rpoReal);
      const peorRto = objs.filter((x) => x.rto !== null && rtoReal !== null && rtoReal > x.rto);
      const peorRpo = objs.filter((x) => x.rpo !== null && rpoReal !== null && rpoReal > x.rpo);
      if (peorRto.length || peorRpo.length) {
        const txt = [peorRto.length && `RTO medido ${fmtH(rtoReal)} frente a ${peorRto.map((x) => `${fmtH(x.rto)} (${x.id})`).join(', ')}`, peorRpo.length && `RPO medido ${fmtH(rpoReal)} frente a ${peorRpo.map((x) => `${fmtH(x.rpo)} (${x.id})`).join(', ')}`].filter(Boolean).join('; ');
        add('TST-02', isBlank(p.accion) ? 'NC mayor' : 'NC menor', amb, `${txt}.${isBlank(p.accion) ? ' Sin acción correctiva.' : ` Acción en curso: ${p.accion}`}`, 'Corregir la causa, repetir la prueba y actualizar el BIA si el objetivo no es realista.');
      }
      if ((p.resultado === 'Fallido' || p.resultado === 'Parcial') && isBlank(p.accion)) add('TST-03', p.resultado === 'Fallido' ? 'NC mayor' : 'NC menor', amb, `Resultado «${p.resultado}» sin acción correctiva asignada.`, 'Registrar la acción, el responsable y la fecha límite.');
    }
    const ultimaGlobal = c.pruebas.find((p) => p.resultado !== 'Cancelado' && p.fecha);
    if (exigeContinuidad && ultimaGlobal && diasEntre(ultimaGlobal.fecha, c.hoy) > 365) add('TST-04', 'NC menor', 'Programa de pruebas', `La última prueba es del ${ultimaGlobal.fecha}.`, 'Ejecutar al menos un ejercicio al año sobre los servicios críticos.');

    const rv = st.revision || {};
    if (!rv.proxima) add('REV-01', 'NC menor', 'Revisión', 'No hay fecha de próxima revisión.', 'Programar la revisión al menos anual y ante cambios significativos.');
    else if (rv.proxima < c.hoy) add('REV-01', 'NC menor', 'Revisión', `La revisión programada para el ${rv.proxima} está vencida.`, 'Revisar el BIA y el plan y registrar la nueva versión.');
    if (isBlank(rv.aprobadoPor)) add('REV-02', 'NC menor', 'Aprobación', 'No consta quién aprueba el plan.', 'Aprobar el BIA y el plan en el comité de dirección y conservar el acta.');

    const peso = { 'NC mayor': 0, 'NC menor': 1, 'Observación': 2 };
    return out.sort((p, q) => peso[p.sev] - peso[q.sev] || p.id.localeCompare(q.id));
  }

  /* Estado de las medidas de continuidad del ENS (RD 311/2022, Anexo II) según la categoría */
  function estadoEns(st, checks) {
    const cat = CATEGORIAS.includes(st.meta && st.meta.categoria) ? st.meta.categoria : 'MEDIA';
    const reglas = { 'op.cont.1': ['BIA-', 'DEP-', 'REV-'], 'op.cont.2': ['DRP-', 'BCP-01', 'BCP-02', 'BCP-03', 'BCK-'], 'op.cont.3': ['TST-'], 'op.cont.4': ['BCP-04', 'BCP-05'] };
    const nombres = { 'op.cont.1': 'Análisis de impacto', 'op.cont.2': 'Plan de continuidad', 'op.cont.3': 'Pruebas periódicas', 'op.cont.4': 'Medios alternativos' };
    const exig = { 'op.cont.1': ['BÁSICA', 'MEDIA', 'ALTA'], 'op.cont.2': ['MEDIA', 'ALTA'], 'op.cont.3': ['MEDIA', 'ALTA'], 'op.cont.4': ['ALTA'] };
    return Object.keys(nombres).map((code) => {
      const own = checks.filter((ch) => reglas[code].some((p) => ch.id.startsWith(p)));
      const aplica = exig[code].includes(cat);

  if (!root || lang() !== 'en') return;
  const blocked = new Set();
  root.querySelectorAll('script, style, textarea, .no-tr').forEach((el) => { blocked.add(el); el.querySelectorAll('*').forEach((n) => blocked.add(n)); });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) { if (n.parentElement && blocked.has(n.parentElement)) continue; const next = tr(n.nodeValue); if (next !== n.nodeValue) n.nodeValue = next; }
  root.querySelectorAll('[placeholder], [aria-label], [title]').forEach((el) => {
    if (el.closest('script, style, .no-tr')) return;
    for (const attr of ['placeholder', 'aria-label', 'title']) { if (!el.hasAttribute(attr)) continue; const next = tr(el.getAttribute(attr)); if (next !== el.getAttribute(attr)) el.setAttribute(attr, next); }
  });
}

/* Escala de tiempo comprimida: distingue minutos y días en el mismo eje */
const T_TICKS = [0, 1, 4, 8, 24, 72, 168];
const tScale = (max, w) => { const m = Math.log1p(max); return (h) => (Math.log1p(Math.max(0, Math.min(h, max))) / m) * w; };
const tickLabel = (h) => (h === 0 ? '0' : h < 24 ? `${h} h` : `${h / 24} d`);

/* Recuperación por función: barra hasta el RTO alcanzable; lo que excede el RTO, en rojo; marcas de RTO y MTPD */
function chartFunciones() {
  const rows = calc.funciones.filter((x) => x.rto !== null).sort((a, b) => a.rto - b.rto);
  if (!rows.length) return emptyState('hourglass', 'Sin objetivos de recuperación', 'Define el RTO de las funciones para ver si vuelven a tiempo.');
  const max = Math.max(24, ...rows.map((x) => Math.max(x.rtoAlcanzable, x.rto, x.mtpd || 0)));
  const L = 220, W = 400, RH = 34, top = 8; const H = top + rows.length * RH + 28;
  const x = tScale(max, W);
  const ticks = T_TICKS.filter((t) => t <= max).concat(max > 168 ? [Math.ceil(max)] : []);
  let g = ticks.map((t) => `<line x1="${L + x(t)}" x2="${L + x(t)}" y1="${top}" y2="${H - 22}" class="grid-l"/><text x="${L + x(t)}" y="${H - 6}" class="ax-t" text-anchor="middle">${tickLabel(t)}</text>`).join('');
  rows.forEach((r, i) => {
    const y = top + i * RH + 8; const bh = 16;
    const ok = r.rtoAlcanzable <= r.rto + 1e-9;
    const label = cut(`${r.id} · ${r.nombre}`, 30);
    const tipTxt = `${r.id} · ${r.nombre}: vuelve a las ${fmtH(r.rtoAlcanzable)} · RTO ${fmtH(r.rto)}${r.mtpd !== null ? ` · MTPD ${fmtH(r.mtpd)}` : ''}`;
    g += `<g class="bar-g tipable" data-tip="${esc(tipTxt)}"><text x="${L - 10}" y="${y + 12}" class="lab-t" text-anchor="end">${esc(label)}</text>
      <rect x="${L}" y="${y}" width="${Math.max(2, x(Math.min(r.rtoAlcanzable, r.rto)))}" height="${bh}" rx="4" class="s-mayor"/>
      ${ok ? '' : `<rect x="${L + x(r.rto)}" y="${y}" width="${Math.max(2, x(r.rtoAlcanzable) - x(r.rto))}" height="${bh}" rx="4" class="s-over"/>`}
      <line x1="${L + x(r.rto)}" x2="${L + x(r.rto)}" y1="${y - 4}" y2="${y + bh + 4}" class="mk-rto"/>
      ${r.mtpd !== null ? `<line x1="${L + x(r.mtpd)}" x2="${L + x(r.mtpd)}" y1="${y - 4}" y2="${y + bh + 4}" class="mk-mtpd"/>` : ''}</g>`;
  });
  return `<div class="chart-scroll"><svg viewBox="0 0 ${L + W + 16} ${H}" class="chart timeline" role="img" aria-label="Tiempo de recuperación por función frente a su RTO y su MTPD">${g}</svg></div>
    <div class="legend"><span><i class="lg s-mayor"></i>Recuperación dentro del RTO</span><span><i class="lg s-over"></i>Tiempo por encima del RTO</span><span><i class="lg mk mk-rto"></i>RTO</span><span><i class="lg mk mk-mtpd"></i>MTPD</span></div>`;
}

/* Reloj de recuperación: un anillo por función con objetivo. El arco llega hasta el momento en que vuelve con las
 * estrategias actuales (verde dentro del RTO, rojo lo que lo excede) y la marca indica el RTO. Escala comprimida
 * (log1p) para que quepan minutos y días en la misma vuelta; la vuelta completa abarca 330°. */
const dialRows = (r) => r.funciones.filter((x) => x.rto !== null).sort((a, b) => a.rto - b.rto || a.id.localeCompare(b.id)).slice(0, 7)
  .map((x) => ({ id: x.id, nombre: x.nombre, rto: x.rto, ach: x.rtoAlcanzable, ok: x.rtoAlcanzable <= x.rto + 1e-9, mtpd: x.mtpd }));
function dial(rows, opt = {}) {
  const S = 400, c = S / 2, R0 = 150, N = Math.max(1, rows.length);
  const step = Math.min(20, N > 1 ? 76 / (N - 1) : 20); const RW = Math.max(7, Math.round(step * 0.68));
  const max = Math.max(72, ...rows.map((r) => Math.max(r.ach, r.rto)));
  const f = tScale(max, 1); const A0 = -Math.PI / 2; const SW = Math.PI * 2 * (330 / 360);
  const pt = (r, t) => { const a = A0 + t * SW; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
  const n2 = (v) => Math.round(v * 100) / 100;
  const arc = (r, t0, t1) => { t1 = Math.max(t1, t0 + 0.004); const [x0, y0] = pt(r, t0); const [x1, y1] = pt(r, t1); return `M${n2(x0)} ${n2(y0)}A${r} ${r} 0 ${(t1 - t0) * SW > Math.PI ? 1 : 0} 1 ${n2(x1)} ${n2(y1)}`; };
  let g = '';
  for (const t of T_TICKS.filter((t) => t <= max).concat(max > 168 ? [] : [])) {
    const [x0, y0] = pt(R0 + RW / 2 + 6, f(t)); const [x1, y1] = pt(R0 + RW / 2 + 12, f(t)); const [lx, ly] = pt(R0 + RW / 2 + 26, f(t));
    g += `<line x1="${n2(x0)}" y1="${n2(y0)}" x2="${n2(x1)}" y2="${n2(y1)}" class="d-tick"/><text x="${n2(lx)}" y="${n2(ly + 4)}" class="d-lab" text-anchor="middle">${tickLabel(t)}</text>`;
  }
  rows.forEach((r, i) => {
    const R = R0 - i * step; const tR = f(r.rto); const tA = f(r.ach);
    const tip = `${r.id} · ${r.nombre}: vuelve a las ${fmtH(r.ach)} · RTO ${fmtH(r.rto)}`;
    const [k0x, k0y] = pt(R - RW / 2 - 3, tR); const [k1x, k1y] = pt(R + RW / 2 + 3, tR);
    g += `<g class="ring tipable" data-tip="${esc(tip)}" style="--i:${i}"><path d="${arc(R, 0, 1)}" class="d-track" stroke-width="${RW}"/>
      <path d="${arc(R, 0, Math.min(tA, tR))}" class="d-ok" stroke-width="${RW}" pathLength="1"/>
      ${r.ok ? '' : `<path d="${arc(R, tR, tA)}" class="d-late" stroke-width="${RW}" pathLength="1"/>`}
      <line x1="${n2(k0x)}" y1="${n2(k0y)}" x2="${n2(k1x)}" y2="${n2(k1y)}" class="d-rto"/></g>`;
  });
  const ok = rows.filter((r) => r.ok).length;
  const centro = opt.centro !== undefined ? opt.centro : `<text x="${c}" y="${c + 6}" class="d-big" text-anchor="middle">${rows.length ? Math.round((ok / rows.length) * 100) : 0}<tspan class="d-pct">%</tspan></text><text x="${c}" y="${c + 30}" class="d-cap" text-anchor="middle">${opt.cap || 'a tiempo'}</text>`;
  return `<svg viewBox="0 0 ${S} ${S}" class="dial${opt.anim ? ' anim' : ''}" role="img" aria-label="${esc(opt.label || `Reloj de recuperación: ${ok} de ${rows.length} funciones vuelven dentro de su RTO`)}">${g}${centro}</svg>`;
}
function ringMini(frac, tone) {
  const r = 17, C = 2 * Math.PI * r; const v = frac === null ? 0 : Math.max(0, Math.min(1, frac));
  return `<svg viewBox="0 0 44 44" class="ring-mini ${tone || ''}" aria-hidden="true"><circle cx="22" cy="22" r="${r}" class="rm-track"/><circle cx="22" cy="22" r="${r}" class="rm-val" stroke-dasharray="${(v * C).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 22 22)"/></svg>`;
}
function metric(label, value, sub, vis, tone) {
  return `<div class="metric ${tone || ''}">${vis}<div class="m-txt"><span class="m-l">${label}</span><span class="m-v num">${value}</span><span class="m-s">${sub}</span></div></div>`;
}

    const matriz = `<div class="table-wrap"><table class="tbl imp-tbl"><caption class="sr">Impacto por horizonte y dimensión</caption><thead><tr><th>Dimensión</th>${E.HORIZONTES.map((hz) => `<th class="c">${hz.label}</th>`).join('')}</tr></thead><tbody>

      <tr class="tot"><th scope="row">Impacto (máximo)</th>${x.curva.map((v) => `<td class="c">${lvlCell(v)} <small>${E.NIVELES[v]}</small></td>`).join('')}</tr></tbody></table></div>`;
    const deps = f.dependencias;

      <dt>Vuelve con lo actual</dt><dd>${fmtH(x.rtoAlcanzable)} ${okBadge(x.cumpleRto, 'Dentro del RTO', 'Fuera del RTO')}</dd>

      <dt>Pérdida de datos posible</dt><dd>${x.rpoAlcanzable === null ? 'Sin activos con datos' : x.rpoAlcanzable === Infinity ? 'Sin copia' : fmtH(x.rpoAlcanzable)} ${okBadge(x.cumpleRpo, 'Dentro del RPO', 'Fuera del RPO')}</dd>
      <dt>Coste de parar hasta el RTO</dt><dd>${eur(x.impactoRto)}</dd>
      <dt>Coste con la recuperación actual</dt><dd>${eur(x.impactoAlcanzable)}${x.exposicion ? ` <span class="badge crit">+${eur(x.exposicion)}</span>` : ''}</dd></dl>`;
    return `<article class="row-card open">${head}<div class="row-body" id="fd-${esc(x.id)}">
      <div class="form-grid g4">

        ${fld('Descripción', inArea(`${p}.descripcion`, f.descripcion), 'span2')}${fld('Alternativa manual o degradada', inArea(`${p}.alternativa`, f.alternativa, 'placeholder="Cómo se sigue prestando sin el sistema"'), 'span2')}

}

/* --- Dependencias --- */
function grafoDependencias() {
  const A = state.activos; const F = state.funciones; const P = state.proveedores;
  if (!F.length) return emptyState('network', 'Sin funciones', 'El mapa se dibuja a partir de las funciones y de lo que necesitan.');
  const depth = new Map(); const visiting = new Set();
  const dOf = (id) => { if (depth.has(id)) return depth.get(id); if (visiting.has(id)) return 0; visiting.add(id); const a = A.find((x) => x.id === id); const d = a && a.dependeDe.length ? 1 + Math.max(...a.dependeDe.map(dOf)) : 0; visiting.delete(id); depth.set(id, d); return d; };
  A.forEach((a) => dOf(a.id));
  const maxD = A.length ? Math.max(...A.map((a) => depth.get(a.id))) : -1;
  const cols = []; for (let d = 0; d <= maxD; d++) cols.push(A.filter((a) => depth.get(a.id) === d).map((a) => ({ t: 'a', o: a })));
  if (P.length) { if (!cols.length) cols.push([]); cols[0] = cols[0].concat(P.map((p) => ({ t: 'p', o: p }))); }
  cols.push(F.map((f) => ({ t: 'f', o: f })));
  const NW = 178, NH = 42, GX = 70, GY = 14, PAD = 12;
  const pos = new Map();
  const H = PAD * 2 + Math.max(...cols.map((c) => c.length)) * (NH + GY);
  cols.forEach((c, ci) => { const off = (H - c.length * (NH + GY)) / 2; c.forEach((n, ri) => pos.set(n.t + n.o.id, { x: PAD + ci * (NW + GX), y: off + ri * (NH + GY), n })); });
  const W = PAD * 2 + cols.length * (NW + GX) - GX + 60;
  const fx = (id) => calc.fxById.get(id); const ax = (id) => calc.activos.find((x) => x.id === id);
  const edges = []; const curve = (s, t, bad, title) => { const x1 = s.x + NW, y1 = s.y + NH / 2, x2 = t.x, y2 = t.y + NH / 2, mx = (x1 + x2) / 2; edges.push(`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" class="edge${bad ? ' bad' : ''}"><title>${esc(title)}</title></path>`); };
  for (const a of A) for (const d of a.dependeDe) { const s = pos.get('a' + d), t = pos.get('a' + a.id); if (s && t) curve(s, t, false, `${a.id} necesita ${d}`); }
  for (const f of F) {
    const t = pos.get('f' + f.id); const x = fx(f.id);
    for (const aId of f.dependencias.activos) { const s = pos.get('a' + aId); const fin = ax(aId)?.fin ?? 0; if (s) curve(s, t, x.rto !== null && fin > x.rto + 1e-9, `${f.id} necesita ${aId}: listo a las ${fmtH(fin)}`); }
    for (const pId of f.dependencias.proveedores) { const s = pos.get('p' + pId); const p = P.find((o) => o.id === pId); if (s) curve(s, t, x.rto !== null && p && (p.slaHoras === null || p.slaHoras > x.rto), `${f.id} depende de ${p ? p.nombre : pId}`); }
  }
  // Dependencias entre funciones: arcos a la derecha de la columna de funciones
  for (const f of F) for (const dId of f.dependencias.funciones) {
    const s = pos.get('f' + dId), t = pos.get('f' + f.id); if (!s || !t) continue;
    const d = fx(dId); const bad = d && fx(f.id).rto !== null && d.rto !== null && d.rto > fx(f.id).rto;
    const x0 = s.x + NW, y1 = s.y + NH / 2, y2 = t.y + NH / 2, bulge = 30 + Math.abs(y2 - y1) * 0.15;
    edges.push(`<path d="M${x0},${y1} C${x0 + bulge},${y1} ${x0 + bulge},${y2} ${x0},${y2}" class="edge fn${bad ? ' bad' : ''}" marker-end="url(#arr${bad ? 'b' : ''})"><title>${esc(`${f.id} depende de ${dId}`)}</title></path>`);
  }
  const nodes = [...pos.values()].map(({ x, y, n }) => {
    const o = n.o; let sub = '', cls = n.t;
    if (n.t === 'a') { const r = ax(o.id); sub = `${E.ESTRATEGIAS[o.estrategia].label} · listo a las ${fmtH(r.fin)}`; if (r.rtoObjetivo !== null && r.fin > r.rtoObjetivo + 1e-9) cls += ' bad'; }
    else if (n.t === 'p') sub = o.slaHoras === null ? 'Proveedor · sin plazo' : `Proveedor · ${fmtH(o.slaHoras)}`;
    else { const r = fx(o.id); sub = `RTO ${fmtH(r.rto)} · vuelve ${fmtH(r.rtoAlcanzable)}`; if (r.cumpleRto === false) cls += ' bad'; }
    const name = `${o.id} · ${o.nombre}`;
    return `<g class="node ${cls}"><rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="10"/><text x="${x + 10}" y="${y + 17}" class="n-t">${esc(cut(name, 26))}</text><text x="${x + 10}" y="${y + 33}" class="n-s">${esc(sub)}</text><title>${esc(name)}</title></g>`;
  }).join('');
  const heads = cols.map((c, ci) => `<text x="${PAD + ci * (NW + GX)}" y="12" class="col-t">${ci === cols.length - 1 ? 'Funciones' : ci === 0 ? 'Base' : `Nivel ${ci}`}</text>`).join('');
  return `<div class="chart-scroll"><svg viewBox="0 -6 ${W} ${H + 12}" width="${W}" class="chart graph" role="img" aria-label="Mapa de dependencias: activos, proveedores y funciones">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arr"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arr bad"/></marker></defs>
    ${heads}${edges.join('')}${nodes}</svg></div>
    <div class="legend"><span><i class="lg edge-l"></i>Dependencia que llega a tiempo</span><span><i class="lg edge-l bad"></i>Llega después del RTO de la función</span><span><i class="lg node-l bad"></i>No cumple su objetivo</span></div>`;
}

  const prov = state.proveedores.map((p, i) => `<tr><td><code>${esc(p.id)}</code></td>
    <td><input type="text" data-set="proveedores.${i}.nombre" value="${esc(p.nombre)}" aria-label="Proveedor" class="w-full"></td>

    ${state.proveedores.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Proveedor</th><th>Servicio</th><th>Contacto de emergencia</th><th class="c">Plazo (h)</th><th>Contrato</th><th class="c">Continuidad verificada</th><th></th></tr></thead><tbody>${prov}</tbody></table></div>` : '<p class="muted">Sin proveedores.</p>'}</section>
  ${deps.length ? `<section class="card"><h2>Incidencias</h2><div class="findings">${deps.map(findingCard).join('')}</div></section>` : ''}`;
}

/* --- Recuperación (DRP) --- */
function gantt() {
  const rows = calc.ordenRecuperacion; if (!rows.length) return emptyState('route', 'Sin activos', 'Añade los activos TIC que sostienen las funciones.');
  const max = Math.max(1, ...rows.map((r) => r.fin)); const L = 250, W = 420, RH = 30, top = 8, H = top + rows.length * RH + 28;
  const x = (h) => (h / max) * W;
  const step = max <= 4 ? 1 : max <= 12 ? 2 : max <= 24 ? 4 : max <= 72 ? 12 : 24;
  let g = ''; for (let t = 0; t <= max + 1e-9; t += step) g += `<line x1="${L + x(t)}" x2="${L + x(t)}" y1="${top}" y2="${H - 22}" class="grid-l"/><text x="${L + x(t)}" y="${H - 6}" class="ax-t" text-anchor="middle">${t} h</text>`;
  rows.forEach((r, i) => {
    const y = top + i * RH + 7; const late = r.rtoObjetivo !== null && r.fin > r.rtoObjetivo + 1e-9;
    g += `<g class="bar-g tipable" data-tip="${esc(`${r.orden}. ${r.id} · ${r.nombre}: de ${fmtH(r.inicio)} a ${fmtH(r.fin)}${r.rtoObjetivo !== null ? ` · lo necesitan antes de ${fmtH(r.rtoObjetivo)}` : ''}`)}">
      <text x="${L - 10}" y="${y + 11}" class="lab-t" text-anchor="end">${esc(cut(`${r.orden}. ${r.id} · ${r.nombre}`, 32))}</text>
      <rect x="${L + x(r.inicio)}" y="${y}" width="${Math.max(3, x(r.fin) - x(r.inicio))}" height="14" rx="4" class="${late ? 's-over' : 's-mayor'}"/>
      ${r.rtoObjetivo !== null && r.rtoObjetivo <= max ? `<line x1="${L + x(r.rtoObjetivo)}" x2="${L + x(r.rtoObjetivo)}" y1="${y - 3}" y2="${y + 17}" class="mk-rto"/>` : ''}</g>`;
  });
  return `<div class="chart-scroll"><svg viewBox="0 0 ${L + W + 16} ${H}" class="chart timeline" role="img" aria-label="Secuencia de recuperación de los activos">${g}</svg></div>
    <div class="legend"><span><i class="lg s-mayor"></i>Listo a tiempo</span><span><i class="lg s-over"></i>Listo después de lo que exigen sus funciones</span><span><i class="lg mk mk-rto"></i>RTO más exigente de las funciones que lo usan</span></div>`;
}
function addActivo() { const id = nextId('A-', state.activos); state.activos.push({ id, nombre: 'Nuevo activo', tipo: 'Servidor', datos: false, estrategia: 'ninguna', tiempoRecuperacion: null, dependeDe: [], ubicacion: '', responsable: '', procedimiento: { pasos: '', exito: '', credenciales: '' }, backup: { aplica: false } }); ui.aOpen = id; commit('Activo añadido'); }
function vRecuperacion() {

    const i = aIdx(r.id); const a = state.activos[i]; const open = ui.aOpen === r.id; const late = r.rtoObjetivo !== null && r.fin > r.rtoObjetivo + 1e-9;
    const head = `<button type="button" class="row-head" data-act="a-toggle" data-id="${esc(r.id)}" aria-expanded="${open}" aria-controls="ad-${esc(r.id)}">
      <span class="ord num">${r.orden}</span><code>${esc(r.id)}</code><span class="rh-name"><b>${esc(a.nombre)}</b><small>${esc(a.tipo)}${a.datos ? ' · guarda datos' : ''}</small></span>

      <div class="form-grid g4">

        ${fld('Tipo', `<select data-set="${p}.tipo">${E.TIPOS_ACTIVO.map((t) => opt(t, t, a.tipo)).join('')}</select>`)}

        ${fld('Tiempo de recuperación (h)', inNum(`${p}.tiempoRecuperacion`, a.tiempoRecuperacion, `placeholder="${E.ESTRATEGIAS[a.estrategia].rto} (típico)"`))}
        ${fld('Ubicación de la réplica o copia', inTxt(`${p}.ubicacion`, a.ubicacion), 'span2')}

      </div>
      <p class="muted small">${esc(E.ESTRATEGIAS[a.estrategia].desc)}. Lo necesitan ${r.funciones.length ? r.funciones.join(', ') : 'ninguna función'}${r.rtoObjetivo !== null ? `; la más exigente pide ${fmtH(r.rtoObjetivo)}` : ''}.</p>
      <div class="grid g2"><div><h4>Procedimiento</h4>
        ${fld('Pasos de recuperación', inArea(`${p}.procedimiento.pasos`, a.procedimiento.pasos, 'rows="6" placeholder="Pasos ejecutables por un técnico sin conocimiento previo del entorno"'))}
        ${fld('Criterio de éxito', inArea(`${p}.procedimiento.exito`, a.procedimiento.exito, 'placeholder="Cómo se verifica que funciona"'))}
        ${fld('Credenciales (referencia a la bóveda, nunca la contraseña)', inTxt(`${p}.procedimiento.credenciales`, a.procedimiento.credenciales))}</div>
        <div><h4>Necesita antes</h4>${checklist(`${p}.dependeDe`, state.activos.filter((o) => o.id !== a.id), a.dependeDe)}</div></div>
      <div class="row end"><button type="button" class="btn sm danger" data-act="del-activo" data-i="${i}">${icon('trash', 15)}Eliminar ${esc(a.id)}</button></div></div></article>`;
  }).join('');
  return `${pageHead('DRP · ISO 22301 § 8.3 y § 8.4.4 · ENS op.cont.2', 'Recuperación', 'Estrategia, tiempo y procedimiento de cada activo TIC. El orden sale de las dependencias: nada se recupera antes que aquello que necesita.', `<button type="button" class="btn primary" data-act="add-activo">${icon('plus', 16)}Añadir activo</button>`)}
  <section class="card"><div class="card-head"><h2>Secuencia de recuperación</h2><span class="muted small">Desde el inicio del incidente</span></div>${gantt()}</section>
  ${cards ? `<div class="row-list">${cards}</div>` : ''}`;

/* --- Copias de seguridad --- */
function vCopias() {
  const filas = calc.activos.map((r) => {
    const i = aIdx(r.id); const a = state.activos[i]; const b = a.backup; const p = `activos.${i}.backup`;
    if (!b.aplica) return `<tr><td><code>${esc(a.id)}</code> ${esc(a.nombre)}${a.datos ? ' <span class="badge accent">datos</span>' : ''}</td><td class="c">${fmtH(r.rpoObjetivo)}</td><td colspan="8" class="muted small">Sin copia definida</td><td class="c"><label class="switch"><input type="checkbox" data-set="${p}.aplica" data-type="bool" aria-label="Copia de ${esc(a.nombre)}"><span></span></label></td></tr>`;
    const lim = r.critico && a.datos ? 30 : 90; const dias = b.ultimaRestauracion ? E.diasEntre(b.ultimaRestauracion, today()) : null;
    const rpoOk = !a.datos || r.rpoObjetivo === null || b.frecuenciaHoras === null ? null : b.frecuenciaHoras <= r.rpoObjetivo + 1e-9;
    const restOk = dias === null ? false : dias <= lim && b.resultado !== 'Fallido';
    const chk = (k, l) => `<td class="c"><label class="switch"><input type="checkbox" data-set="${p}.${k}" data-type="bool" aria-label="${l}"${b[k] ? ' checked' : ''}><span></span></label></td>`;
    return `<tr><td><code>${esc(a.id)}</code> ${esc(a.nombre)}${a.datos ? ' <span class="badge accent">datos</span>' : ''}</td>
      <td class="c">${a.datos ? fmtH(r.rpoObjetivo) : '—'}</td>
      <td><input type="text" data-set="${p}.tipo" value="${esc(b.tipo)}" aria-label="Tipo de copia" class="w-full"></td>
      <td class="c">${inNum(`${p}.frecuenciaHoras`, b.frecuenciaHoras, 'class="w-sm num" aria-label="Frecuencia (horas)"')} ${rpoOk === false ? '<span class="badge crit">RPO</span>' : ''}</td>
      <td class="c"><input type="number" min="0" data-set="${p}.retencionDias" data-type="hrs" value="${b.retencionDias ?? ''}" class="w-sm num" aria-label="Retención (días)"></td>

/* --- Pruebas --- */
function addPrueba() { const id = nextId('T-', state.pruebas); state.pruebas.unshift({ id, fecha: today(), tipo: 'tabletop', funciones: [], activos: [], rtoReal: null, rpoReal: null, resultado: 'OK', gaps: '', accion: '', responsable: '' }); ui.tOpen = id; if (ui.view !== 'pruebas') { commit(); go('pruebas'); } else commit('Prueba registrada'); }
function proximas() {
  const out = []; const hoy = today(); const add = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  for (const r of calc.activos) { const b = r.a.backup; if (!b.aplica || !r.critico) continue; const lim = r.a.datos ? 30 : 90; const prox = b.ultimaRestauracion ? add(b.ultimaRestauracion, lim) : hoy; out.push({ fecha: prox, que: `Restauración de ${r.id} · ${r.nombre}`, tipo: 'restauracion', vencida: prox <= hoy }); }
  for (const x of calc.funciones.filter((f) => f.critica)) {
    const ult = calc.pruebas.find((p) => p.resultado !== 'Cancelado' && p.fecha && ((p.funciones || []).includes(x.id)));
    const prox = ult ? add(ult.fecha, 365) : hoy; out.push({ fecha: prox, que: `Ejercicio sobre ${x.id} · ${x.nombre}`, tipo: 'tabletop', vencida: prox <= hoy });
  }
  return out.sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(0, 8);
}
function vPruebas() {
  const tipos = Object.entries(E.TIPOS_PRUEBA).map(([k, v]) => `<div class="card soft tipo-card">${icon(k === 'restauracion' ? 'hardDrive' : k === 'tabletop' ? 'users' : k === 'simulacro' ? 'flask' : 'zap', 20)}<b>${v.label}</b><small>Cada ${v.periodo} días como máximo</small></div>`).join('');
  const lista = state.pruebas.map((t, i) => {
    const open = ui.tOpen === t.id; const objs = t.funciones.map((id) => calc.fxById.get(id)).filter(Boolean);
    const peor = objs.some((x) => (t.rtoReal !== null && x.rto !== null && t.rtoReal > x.rto) || (t.rpoReal !== null && x.rpo !== null && t.rpoReal > x.rpo));
    const head = `<button type="button" class="row-head" data-act="t-toggle" data-id="${esc(t.id)}" aria-expanded="${open}" aria-controls="td-${esc(t.id)}">
      <code>${esc(t.id)}</code><span class="rh-name"><b>${esc(E.TIPOS_PRUEBA[t.tipo].label)}</b><small>${esc(fmtDate(t.fecha))} · ${esc([...t.funciones, ...t.activos].join(', ') || 'Sin alcance')}</small></span>
      <span class="badge ${t.resultado === 'OK' ? 'ok' : t.resultado === 'Parcial' ? 'warn' : t.resultado === 'Fallido' ? 'crit' : 'neutral'}">${esc(t.resultado)}</span>
      <span class="rh-kv"><small>RTO medido</small><b class="${peor ? 'crit-t' : ''}">${fmtH(t.rtoReal)}</b></span><span class="rh-kv"><small>RPO medido</small><b>${fmtH(t.rpoReal)}</b></span>${icon('chevronDown', 18, 'chev')}</button>`;
    if (!open) return `<article class="row-card">${head}</article>`;
    const p = `pruebas.${i}`;
    return `<article class="row-card open">${head}<div class="row-body" id="td-${esc(t.id)}">
      <div class="form-grid g4">
        ${fld('Fecha', `<input type="date" data-set="${p}.fecha" value="${esc(t.fecha)}">`)}

        ${fld('Resultado', `<select data-set="${p}.resultado">${E.RESULTADOS.map((x) => opt(x, x, t.resultado)).join('')}</select>`)}
        ${fld('Responsable', inTxt(`${p}.responsable`, t.responsable))}
        ${fld('RTO medido (h)', inNum(`${p}.rtoReal`, t.rtoReal))}${fld('RPO medido (h)', inNum(`${p}.rpoReal`, t.rpoReal))}
        ${fld('Carencias detectadas', inArea(`${p}.gaps`, t.gaps), 'span2')}

      <div class="grid g2"><div><h4>Funciones probadas</h4>${checklist(`${p}.funciones`, state.funciones, t.funciones)}</div><div><h4>Activos probados</h4>${checklist(`${p}.activos`, state.activos, t.activos)}</div></div>
      <div class="row end"><button type="button" class="btn sm danger" data-act="del-prueba" data-i="${i}">${icon('trash', 15)}Eliminar ${esc(t.id)}</button></div></div></article>`;
  }).join('');
  const prox = proximas();
  return `${pageHead('ISO 22301 § 8.5 · ENS op.cont.3', 'Pruebas', 'Un plan sin probar es un plan sin validar. Registra cada ejercicio con el RTO y el RPO medidos: se comparan con los objetivos del BIA.', `<button type="button" class="btn primary" data-act="add-prueba">${icon('plus', 16)}Registrar prueba</button>`)}
  <div class="tipo-grid">${tipos}</div>
  ${prox.length ? `<section class="card"><h2>Próximas pruebas</h2><ul class="prox-list">${prox.map((x) => `<li><span class="badge ${x.vencida ? 'crit' : 'neutral'}">${x.vencida ? 'Vencida' : esc(fmtDate(x.fecha))}</span><span>${esc(x.que)}</span></li>`).join('')}</ul></section>` : ''}
  ${lista ? `<div class="row-list">${lista}</div>` : emptyState('flask', 'Sin pruebas', 'Registra el primer ejercicio: aunque sea de mesa, cuenta como evidencia.')}`;
}

function setPath(obj, path, value) {
  const ks = path.split('.');
  if (ks.some((k) => BAD_KEYS.has(k))) return; // defensa ante prototype pollution
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; if (!Object.prototype.hasOwnProperty.call(o, k) || o[k] === null || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }
  o[ks[ks.length - 1]] = typeof value === 'string' ? s(value) : value;
}
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o && !BAD_KEYS.has(k) ? o[k] : undefined), obj); }
function readVal(el) {
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.type === 'num') v = v === '' ? 0 : Math.max(0, Number(v) || 0);
  if (el.dataset.type === 'hrs') v = v === '' ? null : Math.max(0, Math.min(8760, Number(v) || 0));
  if (el.dataset.type === 'int') v = Math.max(0, Math.min(4, Math.round(Number(v) || 0)));
  if (el.dataset.type === 'bool') v = !!el.checked;
  return v;
}

  if (el.dataset.ws) { setPath(ws, el.dataset.ws, readVal(el)); saveWs(); recompute(); render(); return; }
  if (el.dataset.wz) {
    // Solo se redibuja si cambia algo visible (la categoría o un aviso): así no se reemplaza el campo al que pasa el foco
    setPath(ui.wizard, el.dataset.wz, readVal(el)); ui.wizard.error = '';
    const al = document.querySelector('.wizard .alert'); if (al) al.remove();
    if (el.tagName === 'SELECT') render(); return;
  }
  if (el.dataset.rule) { const st = new Set(ws.settings.reglasOff); el.checked ? st.delete(el.dataset.rule) : st.add(el.dataset.rule); ws.settings.reglasOff = [...st]; saveWs(); recompute(); render(); return; }
  if (el.dataset.acc && state) { const k = el.dataset.acc; state.acciones[k] = { ...(state.acciones[k] || { estado: 'Pendiente', responsable: '', fecha: '' }), [el.dataset.f]: s(el.value, 200) }; commit(el.dataset.f === 'estado' && el.value === 'Hecha' ? 'Acción completada' : null); return; }
  if (el.dataset.list && state) {
    const list = getPath(state, el.dataset.list); if (!Array.isArray(list)) return;
    const v = el.value; const next = el.checked ? [...new Set([...list, v])] : list.filter((x) => x !== v);
    setPath(state, el.dataset.list, next); state = sanitizeState(state); commit(); return;
  }
  const path = el.dataset.set; if (!path || !state) return;
  setPath(state, path, readVal(el));
  // Al activar la copia de un activo, se crea con valores por defecto
  if (/^activos\.\d+\.backup\.aplica$/.test(path) && el.checked) { const a = state.activos[+path.split('.')[1]]; a.backup = { aplica: true, tipo: '', frecuenciaHoras: 24, retencionDias: 30, offsite: false, cifrado: false, inmutable: false, ultimaRestauracion: '', resultado: 'Pendiente' }; }
  state = sanitizeState(state); commit();
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'glo-q') { ui.glosarioQ = el.value; clearTimeout(ui._qT); ui._qT = setTimeout(render, 150); }
  if (el.id === 'pal-q') { ui.paletteQ = el.value; ui.paletteIdx = 0; renderPalette(); }
  if (el.dataset.ws === 'profile.nombre' && el.id === 'pf-n') { ws.profile.nombre = el.value; saveWs(); $('#top').innerHTML = renderTop(); localize(); moveThumb('#top .phases'); }
});

let gPending = false;
document.addEventListener('keydown', (ev) => {
  const t = ev.target; const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && t.id !== 'pal-q';
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); ui.palette = !ui.palette; ui.paletteQ = ''; ui.paletteIdx = 0; renderPalette(); return; }
  if (ui.palette) {
    const items = ui._pItems || [];
    if (ev.key === 'Escape') { ui.palette = false; renderPalette(); return; }
    if (ev.key === 'Tab') { ev.preventDefault(); $('#pal-q').focus(); return; }
    if (ev.key === 'ArrowDown') { ev.preventDefault(); ui.paletteIdx = Math.min(items.length - 1, ui.paletteIdx + 1); renderPalette(); return; }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); ui.paletteIdx = Math.max(0, ui.paletteIdx - 1); renderPalette(); return; }
    if (ev.key === 'Enter') { ev.preventDefault(); const it = items[ui.paletteIdx]; ui.palette = false; renderPalette(); if (it) it.act(); return; }
    return;
  }
  if (ev.key === 'Escape') {
    if (ui.menu || ui.confirm) {
      const back = ui.menu ? `[data-act="menu"][data-menu="${ui.menu}"]` : null;
      ui.menu = null; ui.confirm = null; render();
      const b = back && document.querySelector(back); if (b) b.focus({ preventScroll: true });
    }
    return;
  }
  if (/^Arrow(Left|Right|Up|Down)$/.test(ev.key) && t.matches && (t.matches('[role="tab"]') || t.matches('[role="menuitem"]'))) {
    const tab = t.matches('[role="tab"]'); if (tab && /Up|Down/.test(ev.key)) return;
    const list = [...t.parentElement.closest(tab ? '[role="tablist"]' : '[role="menu"]').querySelectorAll(tab ? '[role="tab"]' : '[role="menuitem"]')];
    const d = /Right|Down/.test(ev.key) ? 1 : -1; const n = list[(list.indexOf(t) + d + list.length) % list.length];
    if (n) { ev.preventDefault(); n.focus(); if (tab) n.click(); }
    return;
  }
  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === '?') { ui.helpTab = 'atajos'; go('ayuda'); return; }
  if (ev.key.toLowerCase() === 'g') { gPending = true; setTimeout(() => { gPending = false; }, 900); return; }
  if (gPending) { gPending = false; const m = { p: 'panel', f: 'funciones', d: 'dependencias', r: 'recuperacion', c: 'copias', a: 'preauditoria', t: 'pruebas', i: 'inicio' }[ev.key.toLowerCase()]; if (m) go(m); }
});
document.addEventListener('toggle', (ev) => { const k = ev.target && ev.target.dataset && ev.target.dataset.keep; if (k) ui[k] = ev.target.open; }, true);

/* Tooltip ligero para [data-tip], también con el teclado */
const tip = () => $('#tip');
function showTip(el) {
  const t = tip(); t.textContent = lang() === 'en' ? tr(el.getAttribute('data-tip')) : el.getAttribute('data-tip'); t.hidden = false;
  const r = el.getBoundingClientRect(); const tw = t.offsetWidth;
  t.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + 'px';
  t.style.top = Math.max(8, r.top - t.offsetHeight - 8) + 'px';
}
document.addEventListener('mouseover', (ev) => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (!el) { tip().hidden = true; return; } showTip(el); });
document.addEventListener('focusin', (ev) => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (!el || !el.matches(':focus-visible')) { tip().hidden = true; return; } showTip(el); });
document.addEventListener('focusout', () => { tip().hidden = true; });
document.addEventListener('scroll', () => { tip().hidden = true; }, true);

const toggleOpen = (k, id) => { ui[k] = ui[k] === id ? null : id; render(); };
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (ui.menu && !ev.target.closest('.menu') && !(el && el.dataset.act === 'menu')) { ui.menu = null; render(); }
  if (!el || el.disabled) return;
  const act = el.dataset.act; const i = el.dataset.i !== undefined ? +el.dataset.i : null;
  switch (act) {
    case 'nav': if (el.dataset.locked === '1') { toast('Esta sección requiere un proyecto abierto.'); break; } if (el.dataset.view === 'nuevo' && ui.view !== 'nuevo') ui.wizard = null; go(el.dataset.view); break;
    case 'menu': ui.menu = ui.menu === el.dataset.menu ? null : el.dataset.menu; render(); if (ui.menu) { const f = document.querySelector('.menu [role="menuitem"]'); if (f) f.focus(); } break;
    case 'phase': go(phaseTarget(el.dataset.phase)); break;
    case 'palette': ui.palette = true; ui.paletteQ = ''; ui.paletteIdx = 0; renderPalette(); break;
    case 'pal-close': ui.palette = false; renderPalette(); break;
    case 'pal-run': { const it = (ui._pItems || [])[i]; ui.palette = false; renderPalette(); if (it) it.act(); break; }
    case 'cycle-theme': { const order = ['sistema', 'claro', 'oscuro']; ws.settings.tema = order[(order.indexOf(ws.settings.tema) + 1) % 3]; saveWs(); applyTheme(); render(); toast(`Tema: ${ws.settings.tema}`); break; }
    case 'set': ws.settings[el.dataset.k] = el.dataset.v; ws = sanitizeWs(ws); saveWs(); applyTheme(); render(); break;
    case 'set-color': { ws.profile.color = el.dataset.c; if (el.dataset.c !== 'slate') ws.settings.acento = el.dataset.c; ws = sanitizeWs(ws); saveWs(); applyTheme(); render(); break; }
    case 'help-tab': ui.helpTab = el.dataset.tab; render(); break;
    case 'open-project': openProject(el.dataset.id); break;
    case 'open-case': openCase(el.dataset.case); break;
    case 'reset-case': resetCase(el.dataset.case); break;
    case 'close-demos': for (const p of ws.projects.filter((x) => x.kind === 'demo')) deleteProject(p.id); render(); toast('Casos de ejemplo cerrados'); break;
    case 'ask': ui.confirm = el.dataset.what; render(); break;
    case 'confirm-no': { const w = ui.confirm; ui.confirm = null; render(); const b = w && document.querySelector(`[data-act="ask"][data-what="${CSS.escape(w)}"]`); if (b) b.focus({ preventScroll: true }); break; }
    case 'del-project': deleteProject(el.dataset.id); ui.confirm = null; render(); toast('Proyecto eliminado'); break;
    case 'wipe': for (const p of ws.projects) store.del(PKEY(p.id)); store.del(WS_KEY); ws = sanitizeWs(null); state = null; recompute(); applyTheme(); ui.confirm = null; go('inicio'); toast('Datos borrados'); break;
    case 'ob-save': ws.profileDone = true; saveWs(); render(); toast('Perfil guardado'); break;
    case 'ob-skip': ws.profileDone = true; saveWs(); render(); break;
    case 'backup': backup(); break;
    case 'restore': case 'import-json': ui.menu = null; pickFile('.json,application/json', (f) => checkSize(f, LIM.fileJson, 'El fichero es') && readText(f, importProyecto)); break;
    /* asistente */
    case 'wz-add': ui.wizard.funciones.push({ nombre: '', responsable: '', rto: 24, rpo: 24, mtpd: 72, costeHora: 0 }); render(); break;
    case 'wz-del': ui.wizard.funciones.splice(i, 1); render(); break;
    case 'wz-back': ui.wizard.step--; ui.wizard.error = ''; render(); break;
    case 'wz-next': { const w = ui.wizard;
      if (w.step === 1 && (blank(w.organizacion) || blank(w.sistema))) { w.error = 'Indica la organización y el sistema o alcance.'; render(); break; }
      if (w.step === 2 && w.funciones.some((f) => blank(f.nombre))) { w.error = 'Pon nombre a todas las funciones (o quita las que sobren).'; render(); break; }
      if (w.step === 2 && w.funciones.some((f) => Number(f.rto) >= Number(f.mtpd))) { w.error = 'El RTO de cada función debe ser menor que su MTPD.'; render(); break; }
      w.step++; w.error = ''; render(); break; }
    case 'wz-create': { const w = ui.wizard;
      const funciones = w.funciones.map((f, j) => ({ id: `F-${String(j + 1).padStart(2, '0')}`, nombre: f.nombre, descripcion: '', responsable: f.responsable, rto: f.rto, rpo: f.rpo, mtpd: f.mtpd, costeHora: f.costeHora, alternativa: '', impacto: impactoVacio(), dependencias: { activos: [], funciones: [], proveedores: [] } }));
      const st = blankState({ nombre: w.organizacion, organizacion: w.organizacion, sistema: w.sistema, categoria: w.categoria, responsable: w.responsable, alcance: w.alcance, funciones });
      ui.wizard = null; createProject(st, { view: 'funciones', msg: 'Proyecto creado. Siguiente paso: valora el impacto de cada función.' }); break; }
    /* proyecto */
    case 'f-toggle': toggleOpen('fOpen', el.dataset.id); break;
    case 'a-toggle': toggleOpen('aOpen', el.dataset.id); break;
    case 't-toggle': toggleOpen('tOpen', el.dataset.id); break;
    case 'add-funcion': addFuncion(); break;
    case 'del-funcion': { const id = state.funciones[i].id; state.funciones.splice(i, 1); state = sanitizeState(state); ui.fOpen = null; commit(`Función ${id} eliminada`); break; }
    case 'add-activo': addActivo(); break;
    case 'del-activo': { const id = state.activos[i].id; state.activos.splice(i, 1); state = sanitizeState(state); ui.aOpen = null; commit(`Activo ${id} eliminado`); break; }
    case 'add-prov': state.proveedores.push({ id: nextId('P-', state.proveedores), nombre: 'Nuevo proveedor', servicio: '', contacto: '', slaHoras: null, contrato: '', bcmVerificado: false }); commit('Proveedor añadido'); break;
    case 'del-prov': state.proveedores.splice(i, 1); state = sanitizeState(state); commit('Proveedor eliminado'); break;
    case 'add-rol': state.bcp.equipo.push({ rol: 'Nuevo rol', titular: '', suplente: '', telefono: '', responsabilidades: '' }); commit(); break;
    case 'del-rol': state.bcp.equipo.splice(i, 1); commit(); break;
    case 'add-prueba': addPrueba(); break;
    case 'del-prueba': { const id = state.pruebas[i].id; state.pruebas.splice(i, 1); ui.tOpen = null; commit(`Prueba ${id} eliminada`); break; }
    case 'add-rev': state.revision.historial.push({ version: '', fecha: today(), motivo: '', responsable: '', aprobado: '' }); commit(); break;
    case 'del-rev': state.revision.historial.splice(i, 1); commit(); break;
    case 'sev-f': ui.sevFiltro = ui.sevFiltro === el.dataset.sev ? 'todas' : el.dataset.sev; render(); break;
    case 'pre-tab': ui.preTab = el.dataset.tab; render(); break;
    case 'copy-plantilla': { const txt = state.bcp.comunicacion.plantilla || ''; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Plantilla copiada'), () => toast('No se pudo copiar: selecciona el texto y cópialo a mano', 'error')); break; }
    case 'export-plan': exportar('plan'); break;
    case 'export-informe': exportar('informe'); break;
    case 'export-acciones': exportar('acciones'); break;
    case 'export-json': exportar('json'); break;
    case 'export-xlsx': exportXlsx(); break;
    default: break;
  }
});

/* ---------- Arranque ---------- */
ws = sanitizeWs(store.get(WS_KEY));
applyTheme();
if (ws.activeId && store.get(PKEY(ws.activeId))) { state = sanitizeState(store.get(PKEY(ws.activeId))); recompute(); } else ws.activeId = null;
ui.view = [...PROJECT_VIEWS, ...GLOBAL_VIEWS].includes(initialView) && (state || !PROJECT_VIEWS.includes(initialView)) ? initialView : (state ? 'panel' : 'inicio');
render();
// Puerta para las pruebas automáticas: solo existe al abrir la app con ?test
if (/[?&]test\b/.test(location.search)) window.__KAIROS__ = { get state() { return state; }, get calc() { return calc; }, get ws() { return ws; }, openCase, go, commit };

/* Al cambiar el ancho de la ventana, la píldora del control segmentado se recoloca */
let segRz = null;
window.addEventListener('resize', () => { clearTimeout(segRz); segRz = setTimeout(() => { moveThumb('#top .phases'); moveThumb('#view .tabs'); }, 80); });
requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.add('ready')));
/* Borde de desplazamiento: la línea bajo la cabecera solo aparece cuando hay contenido pasando por debajo */
const edge = () => document.documentElement.toggleAttribute('data-scrolled', window.scrollY > 4);
window.addEventListener('scroll', edge, { passive: true }); edge();

})();
</script>
